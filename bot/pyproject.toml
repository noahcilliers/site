[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chessbot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.3",
  "python-chess>=1.10",
  "fastapi",          # for the POST /move server
  "uvicorn",
  "zstandard>=0.23",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
chessbot-serve = "chessbot.server:main"   # makes a `chessbot-serve` command